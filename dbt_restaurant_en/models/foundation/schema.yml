version: 2

models:
  - name: dim_branches
    description: "Branch dimension with derived fields"
    columns:
      - name: branch_id
        tests: [unique, not_null]
      - name: branch_name
        tests: [not_null]
      - name: opened_date
        tests: [not_null]
      - name: days_since_opening
        tests: [not_null]

  - name: dim_menu_items
    description: "Menu item dimension with price tier (USD)"
    columns:
      - name: menu_id
        tests: [unique, not_null]
      - name: price
        tests: [not_null]
      - name: price_tier
        tests:
          - accepted_values:
              values: ['budget', 'standard', 'premium', 'bundle']

  - name: dim_employees
    description: "Employee dimension for staffing analysis"
    columns:
      - name: employee_id
        tests: [unique, not_null]
      - name: employee_name
        tests: [not_null]
      - name: branch_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_branches')
              field: branch_id

  - name: dim_members
    description: "Member dimension for loyalty analysis"
    columns:
      - name: member_id
        tests: [unique, not_null]
      - name: tier
        tests:
          - accepted_values:
              values: ['Bronze', 'Silver', 'Gold']

  - name: dim_shifts
    description: "Shift dimension"
    columns:
      - name: shift_id
        tests: [unique, not_null]
      - name: shift_name
        tests: [not_null]

  - name: dim_inventory_items
    description: "Inventory item dimension for cost analytics"
    columns:
      - name: inventory_id
        tests: [unique, not_null]
      - name: item_name
        tests: [not_null]
      - name: cost_tier
        tests:
          - accepted_values:
              values: ['low', 'medium', 'high']

  - name: fct_orders
    description: "Granular fact — one row per order line item"
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: branch_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_branches')
              field: branch_id
      - name: menu_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_menu_items')
              field: menu_id
      - name: handler_employee_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_employees')
              field: employee_id
      - name: order_date
        tests: [not_null]
      - name: subtotal
        tests: [not_null]

  - name: fct_employee_attendance
    description: "Daily attendance fact per employee and shift"
    columns:
      - name: attendance_sk
        tests: [unique, not_null]
      - name: attendance_id
        tests: [unique, not_null]
      - name: attendance_date
        tests: [not_null]
      - name: employee_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_employees')
              field: employee_id
      - name: branch_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_branches')
              field: branch_id
      - name: status
        tests:
          - accepted_values:
              values: ['present', 'late', 'leave', 'absent']

  - name: fct_inventory_costs_daily
    description: "Daily branch inventory costs"
    columns:
      - name: cost_date
        tests: [not_null]
      - name: branch_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_branches')
              field: branch_id
      - name: inventory_usage_cost
        tests: [not_null]

  - name: fct_labor_costs_daily
    description: "Daily labor costs from attendance + compensation"
    columns:
      - name: cost_date
        tests: [not_null]
      - name: branch_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_branches')
              field: branch_id
      - name: labor_total_cost
        tests: [not_null]

  - name: fct_branch_operational_costs_daily
    description: "Daily branch overhead costs"
    columns:
      - name: cost_date
        tests: [not_null]
      - name: branch_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_branches')
              field: branch_id
      - name: total_operational_cost
        tests: [not_null]
