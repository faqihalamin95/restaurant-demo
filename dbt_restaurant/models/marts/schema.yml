version: 2

models:
  - name: mart_daily_revenue
    description: >
      Daily revenue per branch with 7-day rolling average.
      pct_change_vs_7d_avg drives Telegram early warning alerts.
    columns:
      - name: order_date
        tests: [not_null]
      - name: branch_id
        tests: [not_null]
      - name: branch_name
        tests: [not_null]
      - name: total_orders
        tests: [not_null]
      - name: total_revenue
        tests: [not_null]

  - name: mart_menu_performance
    description: >
      Daily menu performance with 30-day rolling qty and
      week-over-week change. qty_wow_change drives declining menu detection.
    columns:
      - name: order_date
        tests: [not_null]
      - name: menu_id
        tests: [not_null]
      - name: menu_name
        tests: [not_null]
      - name: total_qty_sold
        tests: [not_null]

  - name: mart_peak_hours
    description: >
      Hourly order distribution per branch and order type.
      day_part and is_peak_hour used for dashboard grouping.
    columns:
      - name: order_date
        tests: [not_null]
      - name: branch_id
        tests: [not_null]
      - name: order_hour
        tests: [not_null]
      - name: day_part
        tests:
          - accepted_values:
              values: ['Morning', 'Lunch Peak', 'Afternoon', 'Dinner Peak', 'Late Night']


  - name: mart_employee_shift_performance
    description: >
      Employee-level transaction handling by shift and attendance status
      for productivity and staffing analysis.
    columns:
      - name: order_date
        tests: [not_null]
      - name: employee_id
        tests: [not_null]
      - name: shift_id
        tests: [not_null]
      - name: orders_handled
        tests: [not_null]
      - name: attendance_status
        tests:
          - accepted_values:
              values: ['present', 'late', 'leave', 'absent']

  - name: mart_member_purchase_behavior
    description: >
      Daily purchase behavior for member customers used to analyze
      buying patterns and loyalty segmentation.
    columns:
      - name: order_date
        tests: [not_null]
      - name: member_id
        tests: [not_null]
      - name: tier
        tests:
          - accepted_values:
              values: ['Bronze', 'Silver', 'Gold']
      - name: total_spend
        tests: [not_null]
