version: 2

models:
  - name: stg_branches
    description: "Cleaned branch master data"
    columns:
      - name: branch_id
        tests: [unique, not_null]
      - name: branch_name
        tests: [not_null]
      - name: opened_date
        tests: [not_null]

  - name: stg_menu_items
    description: "Cleaned menu item master data"
    columns:
      - name: menu_id
        tests: [unique, not_null]
      - name: category
        tests:
          - accepted_values:
              arguments:
                values: ['main', 'drink', 'snack', 'side', 'dessert']
      - name: price
        tests: [not_null]

  - name: stg_orders
    description: "Cleaned order headers. payment_method nullable by design."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: branch_id
        tests: [not_null]
      - name: order_time
        tests: [not_null]
      - name: order_type
        tests:
          - accepted_values:
              values: ['dine_in', 'delivery', 'takeaway']
      - name: handler_employee_id
        tests: [not_null]
      - name: shift_id
        tests: [not_null]

  - name: stg_order_items
    description: "Cleaned order line items"
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: menu_id
        tests: [not_null]
      - name: qty
        tests: [not_null]
      - name: subtotal
        tests: [not_null]

  - name: stg_employees
    description: "Employee master data including assigned shift"
    columns:
      - name: employee_id
        tests: [unique, not_null]
      - name: employee_name
        tests: [not_null]
      - name: branch_id
        tests: [not_null]
      - name: role
        tests:
          - accepted_values:
              values: ['kasir', 'pramusaji', 'supervisor']
      - name: assigned_shift_id
        tests: [not_null]

  - name: stg_members
    description: "Restaurant member profile and membership status"
    columns:
      - name: member_id
        tests: [unique, not_null]
      - name: member_name
        tests: [not_null]
      - name: tier
        tests:
          - accepted_values:
              values: ['Bronze', 'Silver', 'Gold']

  - name: stg_employee_attendance
    description: "Daily attendance history for each employee"
    columns:
      - name: attendance_id
        tests: [unique, not_null]
      - name: attendance_date
        tests: [not_null]
      - name: employee_id
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['present', 'late', 'leave', 'absent']
              severity: warn   # warn dulu, bukan error — agar pipeline tidak langsung patah

  - name: stg_employee_compensation
    description: "Employee compensation setup by branch"
    columns:
      - name: employee_id
        tests: [unique, not_null]
      - name: branch_id
        tests: [not_null]
      - name: base_salary_monthly
        tests: [not_null]

  - name: stg_inventory_catalog
    description: "Inventory item catalog and baseline cost"
    columns:
      - name: inventory_id
        tests: [unique, not_null]
      - name: category
        tests: [not_null]
      - name: base_unit_cost
        tests: [not_null]

  - name: stg_inventory_transactions
    description: "Daily inventory usage and purchase transactions"
    columns:
      - name: inventory_txn_id
        tests: [unique, not_null]
      - name: txn_date
        tests: [not_null]
      - name: txn_type
        tests:
          - accepted_values:
              values: ['usage', 'purchase']
      - name: total_cost
        tests: [not_null]

  - name: stg_branch_daily_operational_costs
    description: "Daily branch overhead (rent, water, electricity, utilities)"
    columns:
      - name: cost_date
        tests: [not_null]
      - name: branch_id
        tests: [not_null]

